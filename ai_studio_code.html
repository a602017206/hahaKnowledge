<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 深度交互粒子系统</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 摄像头预览 - 稍微调小一点以免遮挡太多 */
        #video-input { position: absolute; bottom: 10px; right: 10px; width: 120px; height: 90px; border-radius: 8px; z-index: 2; transform: scaleX(-1); opacity: 0.6; border: 1px solid #444; pointer-events: none; }
        
        /* UI 容器 */
        #ui-container { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; width: 280px; max-width: 80vw; }
        
        /* 控制面板主体 */
        .control-panel { 
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(12px); 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            pointer-events: auto; 
            color: white; 
            overflow: hidden; /* 关键：用于折叠隐藏 */
            transition: background 0.3s;
        }

        /* 标题栏 (可点击) */
        .panel-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid transparent;
            transition: background 0.2s;
        }
        .panel-header:active { background: rgba(255,255,255,0.1); }
        
        h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 1px; color: #00d2ff; display: flex; align-items: center; gap: 8px; }
        
        /* 折叠图标 */
        .toggle-icon { transition: transform 0.3s ease; font-size: 12px; color: #aaa; }
        
        /* 内容区域容器 */
        .panel-content {
            max-height: 500px; /* 设置一个足够大的高度用于动画 */
            opacity: 1;
            padding: 15px;
            padding-top: 5px; /* 调整顶部间距 */
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s, padding 0.3s;
        }

        /* 折叠状态样式 */
        .control-panel.collapsed .panel-header { border-bottom: none; }
        .control-panel.collapsed .toggle-icon { transform: rotate(-90deg); }
        .control-panel.collapsed .panel-content {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            pointer-events: none;
        }

        /* 内部组件样式 */
        .btn-group { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        button { background: #333; border: 1px solid #555; color: white; padding: 6px 10px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 11px; flex: 1; }
        button:hover, button.active { background: #00d2ff; border-color: #00d2ff; color: black; font-weight: bold; }
        
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-top: 5px; }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .custom-file-btn { width: 100%; background: #444; text-align: center; }

        #fullscreen-btn { position: absolute; top: 15px; right: 15px; z-index: 10; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); padding: 8px; border-radius: 50%; cursor: pointer; fill: white; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00d2ff; font-size: 18px; z-index: 20; pointer-events: none; transition: opacity 0.5s; text-align: center; }
        
        .status { font-size: 11px; color: #ccc; margin-top: 10px; line-height: 1.5; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; border-left: 2px solid #00d2ff; }
        .highlight { color: #00d2ff; font-weight: bold; }

        /* lil-gui 样式修正 */
        .lil-gui { --width: 100%; margin-top: 10px; }
    </style>
    <!-- 引入库 -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.18.0/dist/lil-gui.esm.min.js"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">
        <div>🔮</div>
        <div>视觉引擎初始化中...</div>
        <div style="font-size: 12px; color: #666; margin-top: 5px;">请允许摄像头权限</div>
    </div>
    
    <video id="video-input" playsinline></video>
    <div id="canvas-container"></div>

    <button id="fullscreen-btn" title="全屏">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>

    <div id="ui-container">
        <div class="control-panel" id="main-panel">
            <!-- 标题栏：点击可折叠 -->
            <div class="panel-header" onclick="togglePanel()">
                <h2>🎮 交互控制</h2>
                <div class="toggle-icon">▼</div>
            </div>
            
            <!-- 内容区域：会被折叠隐藏 -->
            <div class="panel-content">
                <div class="btn-group">
                    <button onclick="window.changeShape('sphere')" class="active">球体</button>
                    <button onclick="window.changeShape('heart')">爱心</button>
                    <button onclick="window.changeShape('flower')">花朵</button>
                    <button onclick="window.changeShape('saturn')">土星</button>
                </div>
                
                <div class="upload-btn-wrapper">
                    <button class="custom-file-btn">📂 上传图片</button>
                    <input type="file" id="image-upload" accept="image/*" />
                </div>
                
                <div id="gui-container"></div>
                
                <div class="status">
                    <div>🖐️ <b>手势指南:</b></div>
                    <div>• <span class="highlight">拇指+无名指</span> 捏合 -> 缩放</div>
                    <div>• 手掌 <span class="highlight">靠近/远离</span> -> 远近</div>
                    <div>• <span class="highlight">转动手腕</span> -> 旋转模型</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // --- UI 折叠逻辑 ---
        window.togglePanel = () => {
            const panel = document.getElementById('main-panel');
            panel.classList.toggle('collapsed');
        };

        // --- 全局变量 ---
        let scene, camera, renderer, particles, controls;
        let originalPositions = []; 
        let currentPositions = [];  
        const PARTICLE_COUNT = 15000;
        
        let handState = {
            scale: 1.0,      
            targetZ: 0.0,
            rotation: { x: 0, y: 0, z: 0 },
            isDetected: false
        };

        const params = {
            color1: '#00d2ff',
            color2: '#ff00aa',
            particleSize: 0.08,
            morphSpeed: 0.1,
            moveSpeed: 0.08,
            rotateSpeed: 0.1
        };

        // --- 初始化 Three.js ---
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 8;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enableRotate = false; // 禁用鼠标旋转

            createParticles();
            generateSphere();
            updateColors();

            initGUI();
            window.addEventListener('resize', onWindowResize);
            animate();
            
            setTimeout(() => document.getElementById('loading').style.opacity = 0, 1000);
        }

        function createParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 20;
                colors[i] = 1.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: params.particleSize,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8,
                map: createCircleTexture()
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            currentPositions = positions; 
            originalPositions = new Float32Array(PARTICLE_COUNT * 3);
        }

        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        // --- 形状生成 ---
        function generateSphere() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                const r = 3;
                originalPositions[i*3] = r * Math.cos(theta) * Math.sin(phi);
                originalPositions[i*3+1] = r * Math.sin(theta) * Math.sin(phi);
                originalPositions[i*3+2] = r * Math.cos(phi);
            }
            updateColors();
        }

        function generateHeart() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const z = (Math.random() - 0.5) * 4;
                const s = 0.15;
                originalPositions[i*3] = x * s;
                originalPositions[i*3+1] = y * s;
                originalPositions[i*3+2] = z;
            }
            updateColors();
        }

        function generateFlower() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const r_base = Math.cos(4 * theta);
                const r = (r_base + 1.5) * (Math.random() * 0.5 + 0.5);
                originalPositions[i*3] = r * Math.cos(theta) * 2;
                originalPositions[i*3+1] = r * Math.sin(theta) * 2;
                originalPositions[i*3+2] = Math.sin(r * 5) * 0.5 + (Math.random()-0.5);
            }
            updateColors();
        }

        function generateSaturn() {
            const ringCount = Math.floor(PARTICLE_COUNT * 0.4);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let x, y, z;
                if(i < ringCount) { 
                    const ang = Math.random() * Math.PI * 2;
                    const r = 3.0 + Math.random() * 2.0;
                    x = r * Math.cos(ang);
                    y = (Math.random() - 0.5) * 0.2;
                    z = r * Math.sin(ang);
                } else { 
                    const phi = Math.acos(-1 + (2 * (i-ringCount)) / (PARTICLE_COUNT-ringCount));
                    const theta = Math.sqrt((PARTICLE_COUNT-ringCount) * Math.PI) * phi;
                    const r = 2.0;
                    x = r * Math.cos(theta) * Math.sin(phi);
                    y = r * Math.sin(theta) * Math.sin(phi);
                    z = r * Math.cos(phi);
                }
                originalPositions[i*3] = x;
                originalPositions[i*3+1] = y;
                originalPositions[i*3+2] = z;
            }
            updateColors();
        }

        function processImage(imgElement) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 200; 
            canvas.width = size;
            canvas.height = size * (imgElement.height / imgElement.width);
            ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const validPixels = [];
            
            for(let y = 0; y < canvas.height; y+=2) {
                for(let x = 0; x < canvas.width; x+=2) {
                    const i = (y * canvas.width + x) * 4;
                    if(data[i+3] > 128 && (data[i]+data[i+1]+data[i+2])/3 > 30) {
                        validPixels.push({
                            x: (x / canvas.width - 0.5) * 6,
                            y: -(y / canvas.height - 0.5) * 6 * (canvas.height/canvas.width)
                        });
                    }
                }
            }
            if(validPixels.length === 0) return;
            for(let i = 0; i < PARTICLE_COUNT; i++) {
                const p = validPixels[i % validPixels.length];
                originalPositions[i*3] = p.x;
                originalPositions[i*3+1] = p.y;
                originalPositions[i*3+2] = (Math.random() - 0.5) * 0.5;
            }
            updateColors();
        }

        function updateColors() {
            const c1 = new THREE.Color(params.color1);
            const c2 = new THREE.Color(params.color2);
            let minY = Infinity, maxY = -Infinity;
            for(let i = 1; i < PARTICLE_COUNT * 3; i += 3) {
                if(originalPositions[i] < minY) minY = originalPositions[i];
                if(originalPositions[i] > maxY) maxY = originalPositions[i];
            }
            const range = maxY - minY || 1;
            const colors = particles.geometry.attributes.color.array;
            const tmp = new THREE.Color();
            for(let i = 0; i < PARTICLE_COUNT; i++) {
                const t = (originalPositions[i*3+1] - minY) / range;
                tmp.copy(c1).lerp(c2, t);
                colors[i*3] = tmp.r;
                colors[i*3+1] = tmp.g;
                colors[i*3+2] = tmp.b;
            }
            particles.geometry.attributes.color.needsUpdate = true;
        }

        // --- 核心动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            
            const pos = particles.geometry.attributes.position.array;
            const targetScale = handState.scale > 0.1 ? handState.scale : 0.1;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;
                let tx = originalPositions[ix] * targetScale;
                let ty = originalPositions[iy] * targetScale;
                let tz = originalPositions[iz] * targetScale;

                pos[ix] += (tx - pos[ix]) * params.morphSpeed;
                pos[iy] += (ty - pos[iy]) * params.morphSpeed;
                pos[iz] += (tz - pos[iz]) * params.morphSpeed;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            if (handState.isDetected) {
                particles.position.z += (handState.targetZ - particles.position.z) * params.moveSpeed;
                particles.rotation.x += (handState.rotation.x - particles.rotation.x) * params.rotateSpeed;
                particles.rotation.y += (handState.rotation.y - particles.rotation.y) * params.rotateSpeed;
                particles.rotation.z += (handState.rotation.z - particles.rotation.z) * params.rotateSpeed;
            } else {
                particles.position.z += (0 - particles.position.z) * 0.05;
                particles.rotation.y += 0.002;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // --- MediaPipe 视觉逻辑 ---
        function setupMediaPipe() {
            const videoElement = document.getElementById('video-input');
            const hands = new window.Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0, // 手机端改用0以提高性能
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const cameraUtils = new window.Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 320, 
                height: 240,
                facingMode: 'user' // 强制前置
            });
            cameraUtils.start();
        }

        function onHandsResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handState.isDetected = true;
                const lm = results.multiHandLandmarks[0];
                
                const thumbTip = lm[4];
                const ringTip = lm[16]; 
                const wrist = lm[0];
                const middleMcp = lm[9]; 

                // 1. 缩放 (拇指+无名指)
                const pinchDist = Math.hypot(thumbTip.x - ringTip.x, thumbTip.y - ringTip.y);
                let targetScale = (pinchDist - 0.02) * 10; 
                targetScale = Math.max(0.3, Math.min(targetScale, 3.0));
                handState.scale += (targetScale - handState.scale) * 0.1;

                // 2. 远近 (手掌大小)
                const handSize = Math.hypot(wrist.x - middleMcp.x, wrist.y - middleMcp.y);
                let zPos = (handSize - 0.15) * 30.0;
                zPos = Math.max(-10, Math.min(zPos, 6)); 
                handState.targetZ = zPos;

                // 3. 旋转
                const indexMcp = lm[5];
                const pinkyMcp = lm[17];
                let angleZ = -Math.atan2(pinkyMcp.y - indexMcp.y, pinkyMcp.x - indexMcp.x);
                let angleX = (middleMcp.y - wrist.y) * 4.0; 
                let angleY = (indexMcp.z - pinkyMcp.z) * 8.0;

                handState.rotation.z = angleZ; 
                handState.rotation.x = angleX + 0.5; 
                handState.rotation.y = angleY;

            } else {
                handState.isDetected = false;
                handState.scale += (1.0 - handState.scale) * 0.05;
            }
        }

        // --- UI 设置 ---
        function initGUI() {
            const gui = new GUI({ container: document.getElementById('gui-container'), width: '100%' });
            gui.addColor(params, 'color1').name('颜色 1').onChange(updateColors);
            gui.addColor(params, 'color2').name('颜色 2').onChange(updateColors);
            gui.add(params, 'particleSize', 0.01, 0.2).name('粒子大小').onChange(v => particles.material.size = v);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.changeShape = (type) => {
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            switch(type) {
                case 'sphere': generateSphere(); break;
                case 'heart': generateHeart(); break;
                case 'flower': generateFlower(); break;
                case 'saturn': generateSaturn(); break;
            }
        };

        document.getElementById('image-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => { processImage(img); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        init();
        setupMediaPipe();

    </script>
</body>
</html>
